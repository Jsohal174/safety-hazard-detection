# HAWKEYE Main Configuration
# VLM Benchmarking for Warehouse Safety Hazard Detection

defaults:
  - _self_

paths:
  root: ${hydra:runtime.cwd}
  assets: ${paths.root}/hawkeye/simulation/blender/assets
  scenes: ${paths.root}/hawkeye/simulation/blender/scenes
  outputs: ${paths.root}/outputs
  renders: ${paths.outputs}/renders
  datasets: ${paths.outputs}/datasets
  results: ${paths.outputs}/results
  checkpoints: ${paths.outputs}/checkpoints

# Hazard categories (4 + safe)
hazards:
  categories:
    - spill
    - missing_ppe
    - forklift_violation
    - improper_stacking
    - safe
  num_categories: 5
  images_per_category: 60
  total_images: 300

# Dataset splits
dataset:
  name: hawkeye_vlm_v1
  train_ratio: 0.8
  test_ratio: 0.2
  image_resolution: [1920, 1080]

# VLMs to benchmark
vlms:
  - qwen2_5_vl_7b
  - llama3_2_vision_11b
  - internvl2_5
  - gemma3_12b

# Prompt strategies
prompt_strategies:
  - direct
  - descriptive
  - chain_of_thought

# Evaluation
evaluation:
  bert_score_model: "microsoft/deberta-xlarge-mnli"

# Experiment tracking
wandb:
  project: hawkeye-vlm
  entity: null
  enabled: false

seed: 42
